name: reex_player
description: "Reex Player — a maintainable, open-source libmpv player for Android (clean-room rewrite)."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  media_kit: ^1.2.0
  media_kit_video: ^1.3.0
  media_kit_libs_android_video: ^1.3.8
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.5.3

dependency_overrides:
  package_info_plus:
    path: third_party/package_info_plus
  wakelock_plus:
    path: third_party/wakelock_plus

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true